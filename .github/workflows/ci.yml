name: CI
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm run check
      - run: npm run test:package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: artifacts/
  publish:
    name: Publish new version from develop
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ketatlas-npm-publish
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Check version increase and npm registry
        id: release
        run: node scripts/release.mjs
        env:
          BEFORE_SHA: ${{ github.event.before }}
      - name: Download the tested package
        if: steps.release.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: verification-evidence
          path: artifacts/
      - name: Publish the tested archive
        if: steps.release.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Add the NPM_PUBLISH_TOKEN repository secret before publishing."
            exit 1
          fi
          npm publish "artifacts/ketatlas-${RELEASE_VERSION}.tgz" --access public --tag latest --provenance
      - name: Verify the public release
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            echo "Checking npm visibility (attempt $attempt)..."
            if [ "$(npm view "ketatlas@${RELEASE_VERSION}" version --fetch-retries=0 --fetch-timeout=10000)" = "$RELEASE_VERSION" ]; then
              echo "Published ketatlas@${RELEASE_VERSION} to npm." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The published version is not yet visible on npm. Check the registry before retrying."
          exit 1
