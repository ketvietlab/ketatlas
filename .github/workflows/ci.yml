name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      before_sha:
        description: "Previous 40-character commit SHA from the original failed release push"
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      npm_config_fetch_timeout: 30000
      npm_config_fetch_retries: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm run check
      - run: npm run test:package
      - run: npm run build:demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: artifacts/
  publish:
    name: Publish new version from develop
    needs: verify
    if: >-
      false &&
      github.repository == 'ketvietlab/ketatlas' &&
      vars.NPM_RELEASE_ENABLED == 'true' &&
      github.ref == 'refs/heads/develop' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: npm-publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ketatlas-npm-publish
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Check version increase and npm registry
        id: release
        run: node scripts/release.mjs
        env:
          BEFORE_SHA: ${{ github.event.before || inputs.before_sha }}
      - name: Download the tested package
        if: steps.release.outputs.verify == 'true'
        uses: actions/download-artifact@v4
        with:
          name: verification-evidence
          path: artifacts/
      - name: Publish the tested archive
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          archive="$GITHUB_WORKSPACE/artifacts/ketatlas-${RELEASE_VERSION}.tgz"
          if [ ! -f "$archive" ]; then
            echo "::error::The tested package archive was not downloaded: $archive"
            exit 1
          fi
          npm publish "$archive" --access public --tag latest --provenance
      - name: Verify the public release
        if: steps.release.outputs.verify == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          archive="$GITHUB_WORKSPACE/artifacts/ketatlas-${RELEASE_VERSION}.tgz"
          if [ ! -f "$archive" ]; then
            echo "::error::The tested package archive was not downloaded: $archive"
            exit 1
          fi
          for attempt in {1..24}; do
            echo "Checking npm visibility (attempt $attempt)..."
            if node scripts/release.mjs --verify "$RELEASE_VERSION" "$archive"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::npm latest, archive integrity, or provenance did not match. Check the registry before retrying."
          exit 1
